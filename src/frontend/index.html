<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#003366" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Distribución Polar: inventario de galpón y camiones, catálogo y dashboard de indicadores." />
    <title>Distribución Polar</title>
    <script>
      // Aplica el tema guardado antes de pintar para evitar el destello claro en modo oscuro.
      try {
        if (localStorage.getItem('dp.theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
