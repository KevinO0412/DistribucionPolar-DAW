# Entorno Staging: réplica de producción para pruebas de aceptación.
# Secretos obligatorios en .env.staging (ver .env.staging.example). Swagger activo; la BD no se expone.
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env.staging}
    restart: unless-stopped

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-distribucion_polar};Username=${POSTGRES_USER:-polar};Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
      # Origen del frontend autorizado por CORS (vacío = ninguno).
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-}
      JwtSettings__Key: ${JWT_KEY:?Defina JWT_KEY (mínimo 32 caracteres) en .env.staging}
      SeedUsers__0__Username: ${ADMIN_USERNAME:-admin}
      SeedUsers__0__Email: ${ADMIN_EMAIL:-admin@distribucionpolar.local}
      SeedUsers__0__FullName: ${ADMIN_FULLNAME:-Administrador del Sistema}
      SeedUsers__0__Password: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD en .env.staging}
      SeedUsers__0__Role: Admin
      SeedUsers__0__CanChangeAttendant: "true"
      SeedUsers__1__Username: ${EMPLOYEE_USERNAME:-empleado}
      SeedUsers__1__Email: ${EMPLOYEE_EMAIL:-empleado@distribucionpolar.local}
      SeedUsers__1__FullName: ${EMPLOYEE_FULLNAME:-Empleado de Ventas}
      SeedUsers__1__Password: ${EMPLOYEE_PASSWORD:?Defina EMPLOYEE_PASSWORD en .env.staging}
      SeedUsers__1__Role: Employee
    ports:
      - "${API_PORT:-8081}:5000"
    restart: unless-stopped

  spa:
    ports:
      - "${SPA_PORT:-8091}:80"
    restart: unless-stopped
